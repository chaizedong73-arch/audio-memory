<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>现场采集 · 录音记忆</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11141b;color:#f4f5fa;font:16px system-ui;padding:24px 18px}main{max-width:720px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:8px 0}p{line-height:1.6;color:#aeb7ca}video{width:100%;max-height:60vh;background:#080a0e;border-radius:20px;object-fit:contain;margin:18px 0}button{border:0;border-radius:14px;padding:15px 18px;font-size:16px;font-weight:600;background:#c9c6ff;color:#181627;cursor:pointer}button.secondary{background:#282e3d;color:#edf0f7}button:disabled{opacity:.4;cursor:default}.actions{display:flex;gap:10px;flex-wrap:wrap}#status{display:block;margin-top:18px;white-space:pre-wrap;line-height:1.7}small{color:#8995ae}#led{padding:6px 12px;border-radius:20px;background:#263344;color:#b9e4d4;font-size:13px}</style>
<main><header><h1>现场采集</h1><span id="led">未开启</span></header><p>手机是眼睛，电脑保存资料。保持页面在前台；退出或断线会停止采集。仅采集画面，不使用手机麦克风。</p><div id="viewbox" style="position:relative"><video id="video" playsinline autoplay muted></video><canvas id="region" hidden style="position:absolute;pointer-events:none;touch-action:none"></canvas></div><div class="actions"><button id="autoPpt" class="secondary" disabled>自动找PPT</button><button id="selectPpt" class="secondary" disabled>框选PPT</button><button id="wholePpt" class="secondary" disabled>全画面</button></div><p id="pptInfo">PPT默认自动定位；也可手动框选。稳定的新页只提取一次。</p><div class="actions"><button id="open">开启后置摄像头</button><button id="stop" class="secondary" disabled>结束采集</button></div><output id="status">等待电脑接入。</output><p><small>预览约每秒传一帧；只提取稳定的PPT画面与文字，不保存录像。自动定位仅使用本地OCR；云端分析需要手动点击。</small></p></main>
<script>
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);const $=id=>document.getElementById(id);let stream=null,rec=null,session=null,seq=0,queue=Promise.resolve(),busy=false,stopping=false,polling=false,failures=0,uploadFailed=false;
let selecting=false,roi=null,anchor=null;
function message(s){$('status').textContent=s}function led(s){$('led').textContent=s}
async function api(path,body,headers={}){const binary=body instanceof Blob;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(path,{method:body===undefined?'GET':'POST',headers:{Authorization:'Bearer '+token,...(binary?{}:{'Content-Type':'application/json'}),...headers},body:body===undefined?undefined:binary?body:JSON.stringify(body),signal:controller.signal});const result=await response.json();if(!response.ok)throw Error(result.error||'请求失败');return result}finally{clearTimeout(timeout)}}
async function report(error){message(error.message||String(error));try{await api('/error',{error:error.message||String(error)})}catch{}}
async function frame(){if(!stream||busy)return;busy=true;try{if(!$('video').videoWidth)return;const canvas=document.createElement('canvas'),v=$('video'),scale=Math.min(1,1280/v.videoWidth);canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);const png=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));await api('/frame',png)}finally{busy=false}}
function clearRegion(){selecting=false;roi=null;anchor=null;const c=$('region');c.hidden=true;c.style.display='none';c.style.pointerEvents='none';c.getContext('2d').clearRect(0,0,c.width,c.height);c.width=0;c.height=0;c.style.width='0px';c.style.height='0px';}
async function stop(){if(stopping)return;stopping=true;clearRegion();const tracks=stream;stream=null;try{if(tracks)tracks.getTracks().forEach(t=>t.stop());try{await api('/command',{name:'disconnect'})}catch{}$('video').srcObject=null;led('已结束');$('open').disabled=false;$('stop').disabled=$('selectPpt').disabled=$('wholePpt').disabled=$('autoPpt').disabled=true;$('pptInfo').textContent='PPT默认自动定位；也可手动框选。稳定的新页只提取一次。';}finally{clearRegion();stopping=false}}
$('open').onclick=async()=>{try{if(!token)throw Error('请由电脑工具箱打开手机采集页，当前缺少连接码');if(!navigator.mediaDevices)throw Error('请使用工具箱提供的HTTPS或USB本机入口；Wi-Fi首次需要安装项目证书');await api('/hello',{device:navigator.userAgent});stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:15,max:20}}});$('video').srcObject=stream;await $('video').play();$('open').disabled=true;$('stop').disabled=$('selectPpt').disabled=$('wholePpt').disabled=$('autoPpt').disabled=false;led('预览中');message('已连接，正在自动识别PPT页面。');failures=0;}catch(error){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}report(error)}};
$('stop').onclick=stop;
setInterval(async()=>{if(!stream||polling||stopping)return;polling=true;try{const state=await api('/phone');failures=0;if(state.ppt){const p=state.ppt;$('pptInfo').textContent='已提取 '+p.count+' 张 · '+(p.mode==='auto'&&p.auto?p.auto.message+' · OCR '+p.auto.ocrCalls+'次':p.message);if(p.mode==='auto'&&!selecting&&!anchor&&JSON.stringify(roi)!==JSON.stringify(p.roi)){roi=p.roi;paint()}}if(state.closing||state.requested==='disconnect'){await stop();message('电脑已结束采集。');return}await frame()}catch(error){if(!stream||stopping)return;failures++;if(failures>=3){await stop();message('连接已中断，摄像头已关闭。请在电脑重新接入。')}else report(error)}finally{polling=false}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());fetch('/command',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({name:'disconnect'}),keepalive:true}).catch(()=>{})});

function bounds(){const v=$('video'),b=v.getBoundingClientRect(),ratio=Math.min(b.width/(v.videoWidth||1),b.height/(v.videoHeight||1)),w=(v.videoWidth||1)*ratio,h=(v.videoHeight||1)*ratio;return {left:b.left+(b.width-w)/2,top:b.top+(b.height-h)/2,width:w,height:h}}
function paint(){const v=$('video');if(!stream||stopping||!v.videoWidth||!v.videoHeight){clearRegion();return;}const c=$('region'),b=bounds(),parent=$('viewbox').getBoundingClientRect();c.hidden=false;c.style.display='block';c.style.left=(b.left-parent.left)+'px';c.style.top=(b.top-parent.top)+'px';c.style.width=b.width+'px';c.style.height=b.height+'px';c.width=Math.round(b.width);c.height=Math.round(b.height);const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);if(roi){ctx.strokeStyle='#9cffa9';ctx.lineWidth=3;ctx.strokeRect(roi[0]*c.width,roi[1]*c.height,roi[2]*c.width,roi[3]*c.height)}c.style.pointerEvents=selecting?'auto':'none';}
function point(e){const b=bounds();return [Math.max(0,Math.min(1,(e.clientX-b.left)/b.width)),Math.max(0,Math.min(1,(e.clientY-b.top)/b.height))]}
$('selectPpt').onclick=()=>{selecting=!selecting;paint();message(selecting?'在画面上拖动，框住完整PPT；尽量排除讲台和走动的人。':'已取消框选')};
$('autoPpt').onclick=async()=>{try{await api('/ppt',{mode:'auto'});if(!stream||stopping)return;roi=null;selecting=false;paint();message('正在本地自动查找PPT；不确定时可手动框选。')}catch(error){report(error)}};
$('wholePpt').onclick=async()=>{try{await api('/ppt',{roi:null});roi=null;selecting=false;paint();message('已切换为整幅画面检测')}catch(error){report(error)}};
$('region').onpointerdown=e=>{if(!selecting)return;anchor=point(e);$('region').setPointerCapture(e.pointerId);e.preventDefault()};
$('region').onpointermove=e=>{if(!anchor)return;const q=point(e);roi=[Math.min(anchor[0],q[0]),Math.min(anchor[1],q[1]),Math.abs(q[0]-anchor[0]),Math.abs(q[1]-anchor[1])];paint()};
$('region').onpointerup=async e=>{if(!anchor)return;const q=point(e);roi=[Math.min(anchor[0],q[0]),Math.min(anchor[1],q[1]),Math.abs(q[0]-anchor[0]),Math.abs(q[1]-anchor[1])];anchor=null;try{await api('/ppt',{roi});if(!stream||stopping)return;selecting=false;paint();message('PPT区域已锁定；稳定的新画面将自动保存到电脑。')}catch(error){roi=null;paint();if(stream&&!stopping)report(error)}};
$('region').onpointercancel=()=>{anchor=null;roi=null;paint()};$('video').addEventListener('loadedmetadata',paint);window.addEventListener('resize',paint);

if(token)message('连接入口已就绪。点击开启摄像头后，允许浏览器使用摄像头。');else message('缺少连接入口，请由电脑工具箱打开手机页面。');
</script></html>
